version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 3
    groups:
      github-actions:
        patterns: ["*"]

  - package-ecosystem: pub
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 3
      semver-major-days: 7
      semver-minor-days: 3
      semver-patch-days: 3
    groups:
      pub-minor-patch:
        update-types: [minor, patch]
    # The Dart package and the Rust crate must stay on the same version, and the generated code with them.
    ignore:
      - dependency-name: flutter_rust_bridge

  - package-ecosystem: cargo
    directory: /rust
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    ignore:
      - dependency-name: flutter_rust_bridge
    groups:
      cargo-minor-patch:
        update-types: [minor, patch]
