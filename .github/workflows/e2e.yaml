name: End-to-end tests

# Launches the real app and drives it through the UI with the tests in integration_test/, on the
# Linux desktop app and on the web app in Chrome.
on:
  push:
    branches: [ main ]
    paths: &code-paths
      - 'lib/**'
      - 'integration_test/**'
      - 'test_driver/**'
      - 'assets/**'
      - 'linux/**'
      - 'web/**'
      - 'pubspec.yaml'
      - 'pubspec.lock'
      - '.github/workflows/e2e.yaml'
  pull_request:
    branches: [ main ]
    paths: *code-paths
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    name: Linux desktop
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    # GStreamer and its base plugins are what audioplayers needs to create a player.
    - name: Install Linux build dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y ninja-build libgtk-3-dev xvfb \
          libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev \
          gstreamer1.0-plugins-base gstreamer1.0-plugins-good

    - name: Set up Flutter
      uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
      with:
        flutter-version: '3.47.7'
        channel: 'stable'
        cache: true

    - name: Install dependencies
      run: flutter pub get

    - name: Run end-to-end tests
      run: xvfb-run -a flutter test integration_test -d linux

  web:
    name: Web (Chrome)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    - name: Set up Flutter
      uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
      with:
        flutter-version: '3.47.7'
        channel: 'stable'
        cache: true

    - name: Install dependencies
      run: flutter pub get

    # The runner image ships Chrome with a matching ChromeDriver.
    - name: Start ChromeDriver
      run: |
        "$CHROMEWEBDRIVER/chromedriver" --port=4444 &
        sleep 2

    - name: Run end-to-end tests
      run: >-
        flutter drive
        --driver=test_driver/integration_test.dart
        --target=integration_test/app_test.dart
        -d web-server --browser-name=chrome --headless
        --no-web-resources-cdn
