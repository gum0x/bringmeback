name: Flutter CI

on:
  push:
    branches: [ main ]
    paths: &code-paths
      - 'lib/**'
      - 'test/**'
      - 'assets/**'
      - 'windows/**'
      - 'macos/**'
      - 'tool/**'
      - 'pubspec.yaml'
      - 'pubspec.lock'
      - 'analysis_options.yaml'
      - '.github/workflows/cicd.yaml'
  pull_request:
    branches: [ main ]
    paths: *code-paths
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Flutter App
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: macos
            artifact_path: build/macos/Build/Products/Release/*.app
          - os: windows-latest
            target: windows
            artifact_path: build/windows/x64/runner/Release/

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    - name: Set up Flutter
      uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
      with:
        flutter-version: '3.47.7'
        channel: 'stable'
        cache: true

    - name: Install dependencies
      run: flutter pub get

    # The unit tests call Symbolon's native library, built from the package pubspec.yaml pins.
    - name: Build Symbolon for tests
      shell: bash
      run: ./tool/build_symbolon.sh native

    - name: Run tests
      run: flutter test

    # The commit and its time (or the release number, on a vX.Y.Z tag) are shown in the app.
    - name: Build ${{ matrix.target }} app
      shell: bash
      run: flutter build ${{ matrix.target }} --release $(./tool/build_info.sh defines)

    - name: Upload artifacts
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: release-app-${{ matrix.target }}
        path: ${{ matrix.artifact_path }}
        if-no-files-found: error
        retention-days: 14

  # Categorises real tasks with the real LFM2.5 model, the one Settings offers to download.
  lfm:
    name: LFM2.5 categories
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    - name: Set up Flutter
      uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
      with:
        flutter-version: '3.47.7'
        channel: 'stable'
        cache: true

    - name: Install dependencies
      run: flutter pub get

    # Fails when the file the app downloads isn't in the repository any more.
    - name: Download the model
      shell: bash
      run: |
        file=$(grep -o "defaultValue: '[^']*'" lib/category/lfm_categoriser.dart | head -1 | cut -d"'" -f2)
        curl -fSL --retry 3 -o "$RUNNER_TEMP/model.gguf" \
          "https://huggingface.co/LiquidAI/LFM2.5-350M-GGUF/resolve/main/$file"
        echo "LFM_MODEL_PATHS=$RUNNER_TEMP/model.gguf" >> "$GITHUB_ENV"

    # For comparison only: the next size up, which Settings doesn't offer.
    - name: Download the 1.2B model to compare
      shell: bash
      continue-on-error: true
      run: |
        repo=LiquidAI/LFM2.5-1.2B-Instruct-GGUF
        file=$(curl -fsSL "https://huggingface.co/api/models/$repo" | jq -r '.siblings[].rfilename' | grep -i 'Q4_K_M.gguf$' | head -1)
        curl -fSL --retry 3 -o "$RUNNER_TEMP/model-1.2b.gguf" "https://huggingface.co/$repo/resolve/main/$file"
        echo "LFM_MODEL_PATHS=$LFM_MODEL_PATHS,$RUNNER_TEMP/model-1.2b.gguf" >> "$GITHUB_ENV"

    - name: Categorise tasks
      run: flutter test test/lfm_live_test.dart --reporter expanded
