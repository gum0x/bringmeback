name: bringmeback
description: "A Pomodoro timer, stopwatch, and task manager to help you stay focused."
publish_to: 'none'
version: 0.1.0

environment:
  sdk: '>=3.4.4 <4.0.0'

dependencies:
  audioplayers: ^6.8.1
  crdt_lf: 5.1.2
  flutter:
    sdk: flutter
  flutter_bloc: ^9.1.1
  shared_preferences: ^2.5.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/alert.mp3
    - assets/bmb-reminder.mp3
