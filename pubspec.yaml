name: bringmeback
description: "A Pomodoro timer, stopwatch, and task manager to help you stay focused."
publish_to: 'none'
version: 0.1.0

environment:
  sdk: '>=3.4.4 <4.0.0'

dependencies:
  audioplayers: ^6.8.1
  crdt_lf: 5.1.2
  cryptography: 2.9.0
  flutter:
    sdk: flutter
  flutter_bloc: ^9.1.1
  # Symbolon's Dart package, pinned to a release. tool/build_symbolon.sh web downloads the same
  # release's web binding.
  symbolon_flutter:
    git:
      url: https://github.com/common-sec/symbolon
      path: flutter
      ref: v0.2.0
  qr_flutter: 4.1.0
  shared_preferences: ^2.5.6
  web_socket_channel: ^3.0.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  integration_test:
    sdk: flutter

flutter:
  uses-material-design: true
  assets:
    - assets/alert.mp3
    - assets/bmb-reminder.mp3
