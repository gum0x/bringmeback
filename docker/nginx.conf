server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;

    # The default mime.types has no entry for ES modules.
    location ~ \.mjs$ { default_type text/javascript; }

    # Always fetch the newest app shell, so a rebuilt image isn't hidden behind a cached one.
    location = /index.html            { add_header Cache-Control "no-cache"; }
    location = /flutter_bootstrap.js  { add_header Cache-Control "no-cache"; }
    location = /flutter_service_worker.js { add_header Cache-Control "no-cache"; }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
