server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;

    # Check every file with the server before using a cached copy. main.dart.js keeps the same name
    # from build to build, so without this a browser can keep running the old app for hours after
    # the image is rebuilt. On localhost the check costs nothing.
    add_header Cache-Control "no-cache" always;

    # The default mime.types has no entry for ES modules.
    location ~ \.mjs$ { default_type text/javascript; }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
